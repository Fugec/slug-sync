name: Release

# Publishes the distributable plugin zip as a release asset whenever a version
# tag is pushed. GitHub's own "Download ZIP" button archives the repository and
# names its folder <repo>-<ref>, which makes the plugin slug "slug-sync-main"
# and breaks every text-domain check. The asset built here is the only download
# that is safe to install or submit.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['7.4', '8.4']

    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none
      - name: Install test dependencies
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Validate development metadata
        run: composer validate --strict --no-check-publish
      - name: Run unit and regression tests
        run: vendor/bin/phpunit
      - name: Check PHP syntax
        run: find . -path ./vendor -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l

  release:
    needs: quality
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the plugin version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(sed -n 's/^ \* Version: *//p' slug-sync.php | head -1 | tr -d '[:space:]')"

          if [ "$tag" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME declares $tag but the plugin header says $version." >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_ENV"

      # build.sh re-checks the header, SLUG_SYNC_VERSION and Stable tag against
      # each other, so a half-finished version bump fails here rather than
      # reaching the directory.
      - name: Build the plugin zip
        run: bash bin/build.sh

      # A second copy under a fixed name gives a permanent download URL:
      # /releases/latest/download/slug-sync.zip. Both zips are byte-identical
      # and both unpack to a folder named slug-sync.
      - name: Add a stable-named copy
        run: cp "build/slug-sync-${version}.zip" build/slug-sync.zip

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "build/slug-sync-${version}.zip" \
            "build/slug-sync.zip" \
            --title "Slug Sync ${version}" \
            --generate-notes
